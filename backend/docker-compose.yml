# Docker Compose configuration for the WanderMate / Travelling App backend and local MariaDB database.
# Run from the backend folder:
#   docker compose up --build

services:
  db:
    image: mariadb:11
    container_name: traveling-app-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # Host 3307 -> container 3306. This avoids conflict with a local MySQL/MariaDB on 3306.
      - "${DB_HOST_PORT}:3306"
    volumes:
      - traveling-db-data:/var/lib/mysql
      # - ./docker/init:/docker-entrypoint-initdb.d        MariaDB would create the tables before Flyway starts
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: .
    container_name: traveling-app-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 8082 -> container 8080. Avoid 8081 because Expo commonly uses it.
      - "${BACKEND_HOST_PORT}:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_BASE_FOLDER: ${CLOUDINARY_BASE_FOLDER}

      # Defensive Spring Boot override names.
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}

      EMAIL_OAUTH_REFRESH_ENABLED: ${EMAIL_OAUTH_REFRESH_ENABLED}
      EMAIL_CLIENT_ID: ${EMAIL_CLIENT_ID}
      EMAIL_CLIENT_SECRET: ${EMAIL_CLIENT_SECRET}
      EMAIL_REFRESH_TOKEN: ${EMAIL_REFRESH_TOKEN}
      EMAIL_TOKEN_URL: ${EMAIL_TOKEN_URL}
      EMAIL_ADDRESS_CONFIG: ${EMAIL_ADDRESS_CONFIG}

      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET}

      APP_SECURITY_JWT_SECRET: ${JWT_SECRET}
      APP_SECURITY_REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET}

volumes:
  traveling-db-data:
