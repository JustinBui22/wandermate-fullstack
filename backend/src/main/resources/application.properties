spring.application.name=Wandermate
server.port=${PORT:8080}
server.servlet.context-path=/Wandermate

# Database config
# Database URL for MariaDB
spring.datasource.url=${DB_URL}
# Database credentials
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# MariaDB JDBC driver class
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDB106Dialect

# Enable DEBUG logs for Spring Security to verify the request flow and context population
logging.level.org.springframework.security=DEBUG
logging.level.com.example=DEBUG

# Custom security config
app.security.session-token-header=Session-Token
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# Multipart image upload limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Cloudinary image storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.base-folder=${CLOUDINARY_BASE_FOLDER:wandermate}

app.security.jwt-secret=${JWT_SECRET}
app.security.refresh-token-hash-secret=${REFRESH_TOKEN_HASH_SECRET}
app.security.otp-hash-secret=${OTP_HASH_SECRET}

# Flyway migration settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1