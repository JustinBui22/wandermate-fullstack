# Docker Compose configuration for the Traveling App backend and database services (Local demo).
services:
  db:
    image: mariadb:11
    container_name: traveling-app-db
    restart: always
    environment:
      MARIADB_DATABASE: traveling_app
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - traveling-db-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: traveling-app-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}

      EMAIL_OAUTH_REFRESH_ENABLED: ${EMAIL_OAUTH_REFRESH_ENABLED}
      EMAIL_CLIENT_ID: ${EMAIL_CLIENT_ID}
      EMAIL_CLIENT_SECRET: ${EMAIL_CLIENT_SECRET}
      EMAIL_REFRESH_TOKEN: ${EMAIL_REFRESH_TOKEN}
      EMAIL_TOKEN_URL: ${EMAIL_TOKEN_URL}
      EMAIL_ADDRESS_CONFIG: ${EMAIL_ADDRESS_CONFIG}

volumes:
  traveling-db-data: