name: Security Scanning

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 16 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-dependency-audit:
    name: Audit frontend production dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e

          npm audit --omit=dev --audit-level=critical --json > npm-audit-production.json
          AUDIT_EXIT_CODE=$?

          set -e

          if ! jq --exit-status '.metadata.vulnerabilities' npm-audit-production.json >/dev/null 2>&1; then
            echo "::error::npm audit did not return a valid vulnerability report."
            cat npm-audit-production.json
            exit 1
          fi

          echo "Production dependency vulnerability summary:"
          jq '.metadata.vulnerabilities' npm-audit-production.json

          HIGH_COUNT="$(jq --raw-output '.metadata.vulnerabilities.high // 0' npm-audit-production.json)"
          CRITICAL_COUNT="$(jq --raw-output '.metadata.vulnerabilities.critical // 0' npm-audit-production.json)"

          if [ "${HIGH_COUNT}" -gt 0 ]; then
            echo "::warning::npm audit reported ${HIGH_COUNT} high-severity findings. Review the uploaded report and update dependencies when compatible fixes are available."
          fi

          if [ "${CRITICAL_COUNT}" -gt 0 ]; then
            echo "::error::npm audit reported ${CRITICAL_COUNT} critical production dependency findings."
            exit 1
          fi

          if [ "${AUDIT_EXIT_CODE}" -ne 0 ]; then
            echo "::error::npm audit failed before the configured critical-severity policy could be evaluated."
            exit "${AUDIT_EXIT_CODE}"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-production-npm-audit
          path: frontend/npm-audit-production.json
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail

          ARCHIVE_PATH="${RUNNER_TEMP}/gitleaks.tar.gz"
          DOWNLOAD_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --silent --show-error --location "${DOWNLOAD_URL}" --output "${ARCHIVE_PATH}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check --strict
          tar --extract --gzip --file "${ARCHIVE_PATH}" --directory "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan repository history
        run: |
          gitleaks git \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --log-opts="--all" \
            .

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: warn
          retention-days: 14
