name: Security Scanning

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 16 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-dependency-audit:
    name: Audit frontend production dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit production dependencies
        run: npm run audit:prod -- --json > npm-audit-production.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-npm-audit
          path: frontend/npm-audit-production.json
          if-no-files-found: warn
          retention-days: 14

  backend-dependency-audit:
    name: Audit backend dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail

          MAVEN_ARGUMENTS=(
            -B
            -Psecurity-scan
            dependency-check:check
          )

          if [ -n "${NVD_API_KEY:-}" ]; then
            MAVEN_ARGUMENTS+=("-DnvdApiKey=${NVD_API_KEY}")
          fi

          ./mvnw "${MAVEN_ARGUMENTS[@]}"

      - name: Upload OWASP Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-owasp-dependency-check
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
            backend/target/dependency-check-report.sarif
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail

          ARCHIVE_PATH="${RUNNER_TEMP}/gitleaks.tar.gz"
          DOWNLOAD_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --silent --show-error --location "${DOWNLOAD_URL}" --output "${ARCHIVE_PATH}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check --strict
          tar --extract --gzip --file "${ARCHIVE_PATH}" --directory "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan repository history
        run: |
          gitleaks git \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --log-opts="--all" \
            .

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: warn
          retention-days: 14
