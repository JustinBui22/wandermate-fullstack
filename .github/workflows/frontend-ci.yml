name: Frontend CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  EXPO_NO_TELEMETRY: "1"

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Run frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run frontend unit and component tests
        run: npm test

      - name: Generate frontend component coverage
        run: npm run test:components -- --coverage --coverageDirectory=coverage/components

      - name: Validate resolved Expo configuration
        run: npx expo config --type public --json > expo-config.json

      - name: Validate Expo web export
        run: npx expo export --platform web --output-dir dist

      - name: Upload frontend verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-reports
          path: |
            frontend/coverage
            frontend/expo-config.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Expo web export
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-export
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
